<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MangaVault — Pré-visualização rápida</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e6eef8; }
    .card-cover { height: 220px; background: #0b1220; display:flex; align-items:center; justify-content:center; }
    .overlay { background: rgba(2,6,23,0.8); }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">MangaVault — Pré-visualização</h1>
      <p class="text-gray-300 mt-1">Teste rapidamente a interface sem instalar dependências. Arraste PDFs ou selecione arquivos.</p>
    </header>

    <section id="uploader" class="mb-6">
      <div id="drop" class="border-2 border-dashed border-gray-600 rounded p-6 flex flex-col items-center justify-center cursor-pointer" >
        <p class="text-gray-300">Arraste e solte arquivos PDF aqui</p>
        <p class="text-gray-400 mt-2">ou</p>
        <input id="fileInput" type="file" accept="application/pdf" multiple class="mt-3 p-2 bg-gray-800 text-gray-200 rounded" />
      </div>
    </section>

    <section class="mb-4">
      <input id="search" placeholder="Buscar por título..." class="w-full p-2 rounded bg-gray-800 text-gray-200" />
    </section>

    <section>
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
      <div id="empty" class="text-gray-400 text-center mt-6 hidden">Nenhum mangá carregado.</div>
    </section>
  </div>

  <!-- Reader overlay -->
  <div id="readerOverlay" class="fixed inset-0 hidden items-center justify-center overlay">
    <div class="max-w-5xl w-full mx-auto p-4">
      <div class="bg-gray-900 rounded p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-3">
            <button id="closeReader" class="px-3 py-1 bg-gray-800 rounded">Fechar</button>
            <button id="modeToggle" class="px-3 py-1 bg-gray-800 rounded">Modo: única</button>
            <div class="text-sm text-gray-400" id="readerLabel">Página <span id="readerPage">1</span> / <span id="readerTotal">0</span></div>
          </div>
          <div class="flex items-center gap-2">
            <button id="prevPage" class="px-3 py-1 bg-gray-800 rounded">←</button>
            <button id="nextPage" class="px-3 py-1 bg-gray-800 rounded">→</button>
            <input id="pageInput" type="number" min="1" value="1" class="w-20 p-1 rounded bg-gray-800 text-gray-200" />
          </div>
        </div>
        <div id="readerContent" class="bg-gray-800 p-4 rounded overflow-auto" style="height:70vh"></div>
      </div>
    </div>
  </div>

<script>
  // PDF.js worker setup
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');

  const readerOverlay = document.getElementById('readerOverlay');
  const readerContent = document.getElementById('readerContent');
  const closeReader = document.getElementById('closeReader');
  const modeToggle = document.getElementById('modeToggle');
  const readerPage = document.getElementById('readerPage');
  const readerTotal = document.getElementById('readerTotal');
  const prevPage = document.getElementById('prevPage');
  const nextPage = document.getElementById('nextPage');
  const pageInput = document.getElementById('pageInput');

  let items = []; // { file, name, arrayBuffer, numPages, coverDataUrl }
  let current = null;
  let mode = 'single'; // single | scroll

  function showEmpty() {
    empty.classList.toggle('hidden', items.length !== 0);
  }

  function addFiles(files) {
    for (const f of files) {
      if (f.type !== 'application/pdf') continue;
      loadPdfFile(f);
    }
  }

  async function loadPdfFile(file) {
    const arrayBuffer = await file.arrayBuffer();
    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    const pdf = await loadingTask.promise;
    const numPages = pdf.numPages;
    // render first page to canvas
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    const dataUrl = canvas.toDataURL('image/png');

    const item = { file, name: file.name.replace(/\.pdf$/i, ''), arrayBuffer, numPages, cover: dataUrl, createdAt: new Date().toISOString() };
    items.unshift(item);
    renderGrid();
    showEmpty();
  }

  function renderGrid() {
    const q = search.value.trim().toLowerCase();
    grid.innerHTML = '';
    const filtered = items.filter(i => i.name.toLowerCase().includes(q));
    for (const it of filtered) {
      const card = document.createElement('div');
      card.className = 'bg-gray-800 rounded overflow-hidden shadow';
      card.innerHTML = `
        <div class="card-cover">
          <img src="${it.cover}" alt="cover" class="object-cover h-full w-full" />
        </div>
        <div class="p-3">
          <h3 class="font-semibold text-lg truncate">${escapeHtml(it.name)}</h3>
          <div class="text-sm text-gray-400 mt-1">${it.numPages} páginas</div>
          <div class="text-sm text-gray-500 mt-2">Adicionado em ${new Date(it.createdAt).toLocaleString()}</div>
          <div class="mt-3 flex gap-2">
            <button class="openBtn px-3 py-1 bg-violet-600 rounded text-white">Abrir</button>
            <button class="favBtn px-3 py-1 bg-gray-700 rounded text-white">Favoritar</button>
          </div>
        </div>
      `;
      const openBtn = card.querySelector('.openBtn');
      openBtn.addEventListener('click', () => openReader(it));
      grid.appendChild(card);
    }
    if (filtered.length === 0) empty.classList.remove('hidden'); else empty.classList.add('hidden');
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]); }

  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('border-gray-400'); });
  drop.addEventListener('dragleave', () => { drop.classList.remove('border-gray-400'); });
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('border-gray-400'); addFiles(Array.from(e.dataTransfer.files)); });
  fileInput.addEventListener('change', (e) => addFiles(Array.from(e.target.files)));
  search.addEventListener('input', renderGrid);

  // Reader
  async function openReader(item) {
    current = item;
    mode = 'single';
    modeToggle.textContent = 'Modo: única';
    readerOverlay.classList.remove('hidden');
    readerOverlay.style.display = 'flex';
    readerContent.innerHTML = '';
    readerPage.textContent = '1';
    readerTotal.textContent = item.numPages;
    pageInput.value = '1';
    // load PDF document for navigating pages lazily
    const loadingTask = pdfjsLib.getDocument({ data: item.arrayBuffer });
    const pdf = await loadingTask.promise;
    readerOverlay.pdf = pdf; // store
    renderPage(1);
    // restore last page
    const last = localStorage.getItem('mangavault-lastpage-' + item.name);
    if (last) {
      renderPage(Number(last));
    }
  }

  async function renderPage(pageNum) {
    const pdf = readerOverlay.pdf;
    if (!pdf) return;
    const page = await pdf.getPage(pageNum);
    const container = readerContent;
    container.innerHTML = '';
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    container.appendChild(canvas);
    readerPage.textContent = String(pageNum);
    pageInput.value = String(pageNum);
    localStorage.setItem('mangavault-lastpage-' + current.name, String(pageNum));
  }

  async function renderScroll() {
    const pdf = readerOverlay.pdf;
    if (!pdf) return;
    const container = readerContent;
    container.innerHTML = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.2 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      container.appendChild(canvas);
    }
    readerPage.textContent = '1';
    readerTotal.textContent = pdf.numPages;
  }

  modeToggle.addEventListener('click', async () => {
    if (!readerOverlay.pdf) return;
    if (mode === 'single') {
      mode = 'scroll';
      modeToggle.textContent = 'Modo: scroll';
      await renderScroll();
    } else {
      mode = 'single';
      modeToggle.textContent = 'Modo: única';
      const last = Number(localStorage.getItem('mangavault-lastpage-' + current.name) || 1);
      await renderPage(last);
    }
  });

  closeReader.addEventListener('click', () => { readerOverlay.classList.add('hidden'); readerOverlay.style.display = 'none'; readerContent.innerHTML = ''; readerOverlay.pdf = null; });

  prevPage.addEventListener('click', async () => { if (!readerOverlay.pdf || mode !== 'single') return; const p = Math.max(1, Number(pageInput.value) - 1); await renderPage(p); });
  nextPage.addEventListener('click', async () => { if (!readerOverlay.pdf || mode !== 'single') return; const p = Math.min(readerOverlay.pdf.numPages, Number(pageInput.value) + 1); await renderPage(p); });
  pageInput.addEventListener('change', async () => { const val = Math.max(1, Math.min(readerOverlay.pdf.numPages, Number(pageInput.value))); await renderPage(val); });

  // keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (readerOverlay.classList.contains('hidden')) return;
    if (e.key === 'ArrowLeft') prevPage.click();
    if (e.key === 'ArrowRight') nextPage.click();
    if (e.key === 'Escape') closeReader.click();
  });

  showEmpty();
</script>
</body>
</html>
